[project]
name = "neuro-sync-ai-server"
version = "0.1.0"
description = "Neuro-Sync AI service (LLM / Safety / STT / OCR / Handoff — 5 HTTP interfaces)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "neuro-sync-contracts",
    "openai>=2.44.0",
    "matplotlib>=3.11.0",
    # ── RAG 이전 (DB 직접 접속 + 컬럼 암호화) ──────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",  # retrieval async 세션
    "asyncpg>=0.29.0",             # 런타임 async 드라이버
    "psycopg[binary]>=3.1.0",      # 오프라인 로더 sync 드라이버
    "cryptography>=43.0.0",        # AES-256-GCM (message/name 암호화)
    "argon2-cffi>=23.1.0",         # password_hash (api와 동일 계열)
    # ── OCR 라우트 (multipart 업로드) ──────────────────────────────
    "python-multipart>=0.0.9",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest-timeout>=2.4.0",
    "pypdf>=6.14.2",
]

[tool.uv.sources]
neuro-sync-contracts = { path = "../../packages/shared-contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# routes/nearby.py contains a large embedded HTML/CSS/JS template (Kakao Map demo);
# reflowing the string would break the rendered page.
"src/routes/nearby.py" = ["E501"]
# vp011's module docstring embeds a markdown reveal-partition table (design doc content);
# wrapping a table row mid-cell would break markdown table rendering.
"tests/simulation/scenario_packs/vp011_somatic_persistent_late_mood_disclosure.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI helpers are intentionally called in argument defaults (Depends/Query/Form/File).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300
