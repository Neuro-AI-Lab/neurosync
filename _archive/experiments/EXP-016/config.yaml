    agent's own logger.* calls) -- only ClinicalSlotAgent's raw completion is
    incidentally visible via grounding.py's discard-warning log line. This is a system
    logging-coverage constraint, not a check this tracker skipped; the persisted
    Pydantic-output fields are the best available observable surface for those 3 agents.
