    Per chain: (1) F1 schema/slot-key consistency -- final_slots key set == ALL_SLOT_KEYS
    (12 keys, clinical_slot.py:26-39), set-equality checked directly per artifact; (2)
    F1->F2 input-construction key check -- F2 run completes without an "f2.input.empty"
    warning (unless expected) and prior_handoff is None (standalone, no carry channel to
    misuse); (3) F2 Pydantic validation -- domain_inference.json's validation_errors is
    empty/null and finish_reason is not a parse-failure marker; (4) live HPI-isolation --
    final_slots.clinical_assessment and .treatment_plan are null (per clinical_slot v3's
    own "always null" rule for these 2 system-domain slots) AND ai_predicted_disease is
    confirmed a top-level sibling key in domain_inference.json (never nested inside
    domain_candidates or any slot-shaped object -- f2.py:659-664,718-722) AND no F2
    domain/disease name text appears inside F1's own final_slots values (grepped
    per-chain, architecturally impossible since F1 completes and is written to disk
    before F2 is even invoked, but verified empirically per chain, not merely assumed).
  appendix_d_truncation_protocol: >
    Per session: repetition-guard trips count (grep run.log for "repeat"/"repetition"/
    "stopping"), early-termination flag (turns actually reached vs max_turns=10
    requested; result.errors), truncation flag on any affected session's slot-fill
    numbers. CHECKPOINT (item d): if >=3/8 sessions truncate early (non-crisis,
    non-max-turns-reached early exit), STOP after SC-1, route to orchestrator, do not
    launch SC-12+.

