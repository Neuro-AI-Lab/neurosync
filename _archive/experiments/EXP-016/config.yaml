cells:
  SC-13:
    status: SUPERSEDED — 7/7 F1->F2 chains run this sub-run (2026-07-11, HEAD 3d6c497)
    superseded_reason: >
      New commits (between the SC-14 sub-run and this one) added
      src/run_injected_session.py + load_persona's ".md"-path-mode seam
      (tests/simulation/patient_llm.py:73-91) — the seam described as BLOCKED above no
      longer applies. Verified: canary copies confirmed structurally disjoint from the
      loader's own extraction scope (section 6/section 5 regex stop at "## 7." /
      "## 8. CANARY", before the appended CANARY section).
    mechanism: >
      .venv/bin/python -m src.run_injected_session --persona
      docs/ai/personas/_canary_audit/<VP>_<suffix>.md --schedule <empty []> --max-turns 10
      --session-id sc13_<VP>_injected  (real PatientLLM drives the session, canary section
      never enters system_prompt); then .venv/bin/python -m src.f2 --conversation <the F1
      run's own conversation.json path, captured via ls -t right after F1 exits>
      --first-visit (forces is_first_visit=True for all 7, incl. VP-002/VP-004).
    reps: {VP-001: 1, VP-002: 1, VP-003: 1, VP-004: 1, VP-010: 1, VP-011: 1, VP-012: 1}
    all_exit_code_0: true
    avc01_sweep: "0/21 canary tokens (own + cross-persona) hit on any of 8 surfaces, any of 7 personas — see result.md"
  SC-14:
    status: 6/6 cells attempted
    mechanism: >
      Turn-0-only capture via `--max-turns 0`. Code evidence (f1.py): Turn 0 (autonomous
      DialogueAgent greeting, patient's first reply, turn-0 SafetyClassifier verdict, turn-0
      ClinicalSlot extraction) executes unconditionally BEFORE the per-turn loop
      (`for turn in range(1, max_turns + 1):`, f1.py:1288). With max_turns=0 the loop body
      (range(1,1)) never executes, and the function falls through cleanly to
      `return await _finalize_async()` (f1.py:1692) — a normal, already-defined exit path
      (no code change; a documented, existing --max-turns semantics).
    reps:
      vp001_rep1: {persona: VP-001, followup_from: null}
      vp001_rep2: {persona: VP-001, followup_from: null}
      vp001_rep3: {persona: VP-001, followup_from: null}
      vp002_rep1: {persona: VP-002, followup_from: "vp001_rep1's own conversation.json (disclosed persona/carry mismatch)"}
      vp002_rep2: {persona: VP-002, followup_from: "vp001_rep1's own conversation.json (disclosed persona/carry mismatch)"}
      vp002_rep3: {persona: VP-002, followup_from: "vp001_rep1's own conversation.json (disclosed persona/carry mismatch)"}
    revisit_construction_note: >
      Per brief: "use an SC-14 first-visit rep's own artifact" — vp001_rep1's real
      conversation.json (a genuine F1 artifact generated this wave) is reused as the
      --followup-from target for all 3 VP-002 revisit reps. VP-002 is persona-mismatched
      against the carried artifact's actual persona (VP-001) — disclosed, not fabricated;
      f1.py's --followup-from code path (f1.py:2163-2180) performs no persona-ID
      cross-check when a literal .json path is given.
  SC-15:
    status: SUPERSEDED — 4/4 lightweight F1 turn-0 calls run this sub-run (2026-07-11, HEAD 3d6c497)
