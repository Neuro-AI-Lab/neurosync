  - id: cellB_vp001_forced_gad7
    persona: VP-001
    cmd: >
      cd apps/ai-server && .venv/bin/python -m src.continuous_test --persona VP-001
      --start-from-conversation <Cell-A-session-1-conversation.json, resolved after Cell A completes>
      --force-questionnaire GAD-7 --answer-mode llm
    purpose: >
      Forced GAD-7 administration engine exercise (REV-038 evidence-class row 3:
      F3-administration-engine-only, never F2-linkage/selection evidence). Reuses Cell A
      session-1's F1 conversation.json (F1 stage skip); F2 re-runs fresh on that conversation
      (no F2-output-reuse path exists in the harness -- confirmed by code read, continuous_test.py
      run_f2_stage always re-executes). Descriptive-only reporting (raw total + qualitative
      severity-band note); no per-item +/-1 check (no per-item GAD-7 ground truth exists in
      either persona file, REV-038 Issue 4); no invented total pass/fail band.
    administration_mode_expected: forced
    depends_on: cellA_vp001_natural (F1 artifact reuse only)
