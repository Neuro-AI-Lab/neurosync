ledger_isolation_deviation (READ FIRST -- material pre-run finding, not anticipated by any prior
    gate):
  finding: "docs/ai/simulation_results/VP-001/VP-001_session_ledger.json pre-existing at launch:
    9 entries (from EXP-016/017/018/019/020-CellA, all session_index in {1,2}, none carrying
    scenario_pack_id). VP-003_session_ledger.json: 7 entries (EXP-016/017/018/019), same shape.
    run_f4_stage/_run_f4_analysis (continuous_test.py:950-996) reads and consumes the FULL
    ledger file for a persona_id with NO filtering by scenario_pack_id -- confirmed by reading
    _build_session_record (continuous_test.py:881-947): the only exclusion criterion is a
    missing/unreadable conversation_path, which none of the 9/7 legacy entries have. Left as
    default (no --out), F4's post-loop stage would silently blend all 9/7 legacy entries
    (unrelated batteries: SC-13/14/15 canaries, BUG-030 fix validation, forced-GAD-7 engine
    exercises, etc.) with the new 11 scripted sessions into one n=16-20 series, sorted by
    session_index -- duplicate session_index values (multiple legacy entries at index 1/2) would
    make records[0]/records[-1] (the Criterion-0 first-vs-last basis ADR-036 item 1 mandates)
    resolve to an ARBITRARY legacy entry, not the scripted S1 baseline, and would silently violate
    REV-044 wording-table row 5 ('single-batch n=1 arc per VP') by misreporting n_sessions. This
    is a genuine gap in PLAN-2026-W29-D's design (not caught by REV-044/CVR-020/CVR-021/ADR-036,
    all of which read the ledger-entry CONSTRUCTION code but not this cross-invocation
    accumulation semantic) -- qa's step-8 raw-field recompute (§7.2) would not catch it either,
    since it would recompute from the SAME contaminated ledger and trivially match."
  resolution_chosen: "--out override pointing F2/F3/F4/ledger output at
    experiments/EXP-023/runs/<vp>/artifacts/ (isolated, fresh, per-arc) for BOTH arcs. Verified by
    reading code: f1._run_simulation (src/f1.py:2260) takes NO out_dir parameter and always saves
    conversation.json under the fixed src.f1.OUTPUT_DIR (docs/ai/simulation_results/<VP>/) --
    unaffected by --out, harmless (timestamp-unique filenames, no ledger-style aggregation risk,
    and _find_latest_f1_conversation always glob-sorts to the newest file regardless of
    pre-existing pollution). F2 (f2.py:968 save_f2_result), F3 (f3.py:443 save_f3_result), F4
    (f4_report.py:34 save_f4_result), and the ledger (_ledger_path, continuous_test.py:155-160)
    ALL respect out_dir -- confirmed by reading each. Result: a genuinely clean, 11-entry-only
    ledger and F4 series per VP, fully within experiment-tracker's own write authority
    (experiments/EXP-023/), zero code edits."
  deviation_from_design_doc: "design doc §5.1/§5.2 states F4 outputs land in
    docs/ai/simulation_results/<VP>/ ('same dir as every other F1-F3 artifact... no new
    directory'). This run deviates: F4's temporal.json/_temporal_report.md/PNGs, plus this
    battery's own F2/F3 artifacts, land under experiments/EXP-023/runs/<vp>/artifacts/<VP>/
    instead. F1's conversation.json/report.md still land in the shared docs/ai/simulation_results/
    <VP>/ per the unavoidable OUTPUT_DIR hardcoding. Flagged prominently for critic (REV, step 9)
    and developer: recommend a future scenario-pack-scoped ledger filter or --fresh-ledger flag in
    src/continuous_test.py so a clean run does not require this out-of-band directory override."
  not_a_fix: "no src/ file was read-modified-written; this is a pre-run CLI-flag choice within
    experiment-tracker's own experiments/ write authority, not a code fix to the F4 mission."

