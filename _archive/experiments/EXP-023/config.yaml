wording_discipline_binding: >
  REV-044's MAY/MUST-NOT wording table (6 rows) is binding verbatim on this entry's Results/Key
  findings. In particular: MAY say F4 correctly computed the shipped direction verdicts given the
  actual raw scores this battery produced (once qa's step-8 recompute confirms it) and that the
  pipeline demonstrated end-to-end capability to track a scripted narrative into a directionally
  congruent trajectory; MUST NOT say F4 "detects"/"validates" clinical state change in general, or
  that this battery tested sensitivity/specificity, or that the scripted arcs are independent
  ground truth. similarity_score is a TREND over noisy inputs (VAL-014 inherited), never a
  probability. CVR-021's binding condition on the VP-003 S8 event: MUST NOT characterize it as
  validating a guardian-liaison-recommendation capability (none exists in apps/ai-server/src, 0
  grep hits for 보호자) -- MAY describe it only as patient-initiated narrative loosely motivated by
  the system's actual crisis-response output (hotline referral + protective-factors probe). No
  stable/no-net-change arc was scripted this mission (REV-044 Issue 3/ADR-036 item 2, accepted) --
  MUST NOT claim F4's stable-patient false-positive behavior was tested.
