wording_discipline_binding: >
  REV-040 SS5 MAY/MUST-NOT table binding verbatim. No H1/H2/H3/interaction-driven claim without
  Tier-1 (this run IS Tier 1, 10 administrations, contingent on both new corner replicates
  actually completing). MAY NOT say "EXP-021 exercised F3's natural or forced production
  pathway" or "the item-9 safety pathway was exercised". MAY NOT rule out an unnamed
  prompt-coherence artifact for cells 2-7. Pool historical corner data only per this file's
  pre_run_comparability_check_REV040_2_1 section (PASS, disclosed methodology deviation on
  item c). MAY NOT say "resolves/settles" the over-endorsement mechanism. MAY NOT describe the
  item_bank override seam as newly built for EXP-021. sigma uses the larger of (historical+new
  pooled) or (new-only) range per corner, per REV-040's own protective formula.
