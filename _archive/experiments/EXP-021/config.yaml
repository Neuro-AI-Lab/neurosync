model:
  vendor: lg_k_exaone
  base_url: "https://api.friendli.ai/dedicated/v1"
  model_id_env: LG_K_EXAONE_ENDPOINT_ID
  temperature: 0.7   # hardcoded in survey_answer_llm.py:_ask, unconditional, no --seed (driver
                      # docstring: no seed param reaches the completion call anywhere in this
                      # codebase; a harness --seed flag would misrepresent reproducibility)

hardware: CPU-only orchestration host; inference via Friendli K-EXAONE (hosted API)

persona: VP-001 (docs/ai/personas/VP-001_first_visit_mild.md) -- documented PHQ-9
  [1,1,2,1,1,0,1,0,0], total 7 (line 81-94)
scale: PHQ-9 only (9 items)
bypass_mode: >
  Calls src.f3.administer_survey directly via its pre-existing item_bank override seam --
  never f3.run_f3_administration/src.continuous_test.run_f3_stage. No F1/F2 pipeline calls.
  Consequences (disclosed structurally in every artifact by the driver itself):
  safety_pathway_exercised=false (item-9 deterministic ROUTING not invoked; critical_item_positive
  IS still computed/reported per cell); artifacts are NOT SurveyResultOutput/survey.json-shaped;
  HPI-isolation is N/A (no F1/F2 artifacts generated).

budget_plan: >
  Tier 1 (10 administrations, REV-040's pre-registered minimum for licensing any
  H1/H2/H3/interaction-driven battery-level claim): 8 base cells (1 each) + 1 replicate each on
  Cell 1 and Cell 8. Hard cap 12 (user directive ~8-12). Sequential execution (rate-limit
  friendly), one driver invocation per (cell, replicate) = 9 item-level SurveyAnswerLLM calls
  each = up to 90 K-EXAONE calls total for 10 administrations.

