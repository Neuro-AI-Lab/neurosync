    VP-001: [anxiety, sleep]
    VP-002: [depression]
    VP-003: [depression]
    VP-004: [depression, anxiety]
  rule: >
    top-1 hit = domain_candidates[0].domain in golden set (binary).
    top-3 hit = any returned domain_candidates[].domain in golden set (binary, existential; cap already <=3 by contract).
    no partial credit. domain_candidates=[] scores 0 for both (REV-007 amendment 2, REV-011 sec 3 rule v).
    raw counts only, no percentage/rate wording.
  department: "descriptive only, not scored (DATASET-004)"

binding_metrics_REV-011:
  rule_i_rollback_trigger: "secondary manual broader-taxonomy audit of EVERY accepted, post-cascade evidence quote, both arms, all VPs. Primary evidence_stripped_risk_lexicon counter is diagnostic-only, NOT recurrence=0 evidence."
  rule_ii_queries_audit: "retrieval_meta.queries audited for every RAG run — confirm risk_assessment absent AND check chief_complaint/HPI content against broader taxonomy (not just risk_assessment's absence), per REV-011 sec 2/3-ii structural-incompleteness finding for VP-003."
  rule_iii_orphan_disambiguation: "orphan_departments entries cross-checked against filter_summary.eliminated_domains before counting as a rollback trigger."
  rule_iv_finish_reason: "finish_reason/usage reported verbatim for every VP-003 RAG run (and batch max completion_tokens noted) — BUG-017 live closure evidence."
  rule_v_zero_candidate: "domain_candidates=[] scores 0 for top-1 and top-3."

evaluation:
  grounding: "f2.py's own runtime evidence-whitelist + rejection cascade (src.eval.f2_grounding) runs per-run automatically; tracker additionally spot-checks evidence entries per arm against source conversation JSON / DB chunk text by hand (>=2 runs/arm)"
  latency: "per-run latency_ms from artifact repro metadata; p50/p95/mean/min/max reported descriptively vs inherited SLA note (3s llm_only / 5s RAG) — no pass/fail wording"

artifact_note: >
  f2.py hardcodes its output directory to docs/ai/simulation_results/<VP>/; no --output-dir
  override used. docs/ai/simulation_results/ stays the canonical run output location;
  experiments/EXP-006/runs/<arm>/<VP>/run{1,2}/ mirrors (copies) each run's artifact JSON +
  report.md + stdout log, identified by before/after directory-listing diff (timestamped
  filenames, no collision risk observed).

infra_failure_policy: >
  No infra failures occurred (all 16 invocations exit_code=0, no network/process errors).
  3 RAG-arm runs (VP-001/run1, VP-003/run1, VP-003/run2) produced LLM-output parse/schema
  failures (0 candidates) — this is f2.py's designed fail-safe degrade path (no crash, honest
  mode=rag labeling), the same class of outcome EXP-005 reported as final (not retried) for
  VP-003's 2 RAG runs. Per that precedent, and because a retry would call a non-deterministic
  live LLM again (changing what is being measured, not re-running an infra fault), these 3
  runs were NOT retried under the brief's 1-retry rule — that rule is read as applying to
  process/network infra failures, not to a designed, schema-validated model-output outcome.
  Reported as final results below; flagged prominently, not smoothed.

