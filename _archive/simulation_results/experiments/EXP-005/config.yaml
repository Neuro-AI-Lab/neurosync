runs:
  llm_only_arm:
    command: ".venv/bin/python -m src.f2 --conversation <F1 conversation.json, absolute path> --no-rag"
    personas: [VP-001, VP-002, VP-003, VP-004]
    n_per_vp: 2
    input_selection: "identical 20260707 EXP-002-era F1 conversation artifacts as EXP-004 (like-for-like)"
    inputs:
      VP-001:
        - docs/ai/simulation_results/VP-001/VP-001_20260707_152922_conversation.json
        - docs/ai/simulation_results/VP-001/VP-001_20260707_153451_conversation.json
      VP-002:
        - docs/ai/simulation_results/VP-002/VP-002_20260707_154130_conversation.json
        - docs/ai/simulation_results/VP-002/VP-002_20260707_154407_conversation.json
      VP-003:
        - docs/ai/simulation_results/VP-003/VP-003_20260707_155149_conversation.json
        - docs/ai/simulation_results/VP-003/VP-003_20260707_155446_conversation.json
      VP-004:
        - docs/ai/simulation_results/VP-004/VP-004_20260707_155542_conversation.json
        - docs/ai/simulation_results/VP-004/VP-004_20260707_155625_conversation.json
  rag_arm:
    command: ".venv/bin/python -m src.f2 --conversation <same F1 conversation.json> (no --no-rag)"
    personas: [VP-001, VP-002, VP-003, VP-004]
    n_per_vp: 2
    inputs: "same 8 files as llm_only_arm (same VP/run pairing, mode flag differs only)"
    verification: "every run's retrieval_meta.mode must == 'rag'; any silent llm_only downgrade = rollback trigger, stop and flag"

scoring:
  dataset: DATASET-004 as amended by REV-007 Part A (same golden sets as EXP-004)
  golden_sets:
    VP-001: [anxiety, sleep]
    VP-002: [depression]
    VP-003: [depression]   # alcohol excluded from scoring set; REV-007 amendment 1 governs wording if {alcohol} alone is returned
    VP-004: [depression, anxiety]
  rule: >
    top-1 hit = domain_candidates[0].domain in golden set (binary).
    top-3 hit = any returned domain_candidates[].domain in golden set (binary, existential; cap already <=3 by contract).
    no partial credit. domain_candidates=[] scores 0 for both (REV-007 amendment 2, REV-009 Attack 5/6 re-affirmed).
    raw counts only, no percentage/rate wording.
  department: "descriptive only this batch, not scored (DATASET-004)"

binding_metrics_REV-009:
  primary_diagnostic: "filter_summary.evidence_stripped_risk_lexicon per run — count of LLM ATTEMPTS to cite risk expressions. A 0 here does NOT mean the rule held; reported raw."
  secondary_rollback_trigger: >
    manual first-pass audit of EVERY accepted post-cascade evidence quote, all runs both arms,
    against the broader taxonomy (passive SI / burdensomeness 짐이 되·내가 없으면 /
    meaninglessness 사는 게 의미·살아서 뭐하 / passive death-wish incl. 차라리 죽·죽는 게 낫 /
    죽으면 편할). Surviving taxonomy quote > 0 -> STOP further runs, flag first in Evidence.
    critic re-audits authoritatively at Stage 2g; this is a first-pass count.
  fabrication: "whitelist audit 0 required (source_id + quote<->chunk/utterance lexical) + spot-check >=2 runs per arm"
  val_010_condition: "record Stage-1 retrieval queries per RAG run (retrieval_meta.queries); report whether risk_assessment slot text was embedded as a query and its content class, uncensored"
  orphan_disambiguation: "any orphan_departments finding cross-checked against filter_summary.eliminated_domains before classification — cascade-eliminated-domain refs are NOT the pre-existing orphan-department rollback class"
  latency: "p50/p95 per arm; RAG arm reports Stage-1/Stage-2 split if artifact separates them"

evaluation:
  grounding: "f2.py's own runtime evidence-whitelist + rejection cascade (src.eval.f2_grounding) runs per-run automatically; tracker additionally spot-checks >=2 saved artifacts' evidence entries per arm against source conversation JSON by hand"
  latency: "per-run latency_ms from artifact repro metadata; p50/p95 reported descriptively vs inherited SLA note (3s llm_only / 5s RAG) — no pass/fail wording"

artifact_note: >
  f2.py hardcodes its output directory to docs/ai/simulation_results/<VP>/ (OUTPUT_DIR from
  f1.py, PROJECT_ROOT/docs/ai/simulation_results/...); no --output-dir override used.
  docs/ai/simulation_results/ stays the canonical run output location;
  experiments/EXP-005/runs/<arm>/<VP>/run{1,2}/ mirrors (copies) each run's artifact JSON +
  report.md + stdout log.

constraints: "No code/prompt edits. No 인증/통과/개선 wording. Numbers only with artifact paths. Infra failure -> 1 retry -> record failed. Any rollback trigger fires -> STOP, flag first line, report — no pin changes by this agent."
