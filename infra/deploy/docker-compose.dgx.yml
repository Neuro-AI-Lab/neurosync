# DGX Spark production deployment — ai-server + api.
#
# ⚠️  STANDALONE file, NOT an override of docker-compose.yml — run with ONLY
#     `-f infra/deploy/docker-compose.dgx.yml`. Never combine the two files.
#
#   - The DB server already runs on this DGX as a separately managed container
#     (external 28881 → postgres 5432). This file deliberately defines NO
#     postgres service — never start a second DB from here. Both ai-server and
#     api reference the same standing external DB via DATABASE_URL in their
#     respective .env files (env_file below); neither service owns the DB
#     container.
#   - Distinct compose project name + container name → zero state collision
#     with any compose project or container already on the DGX.
#   - External port 24855 is the allocated ai-server port. Backend base URL:
#     http://223.194.33.26:24855  (container listens on 8001, Dockerfile CMD).
#   - External port 24858 for `web` (this file) is a PLACEHOLDER, not yet
#     confirmed by NAT reconnaissance (parallel to the 24856/24857 correction
#     below) — kept as a compose variable (WEB_EXTERNAL_PORT) so the operator
#     can override it with one env value, no compose edit, once the real port
#     is confirmed.
#   - External port 24857 is the allocated api port (corrected 2026-07-26,
#     see docs/ai/deployment_integration_plan.md §3 — the operator confirmed
#     external 24856 is already NAT-routed to the DGX host's SSH port 22, not
#     available for a service; 24855/24857 pass through 1:1 to the same
#     container-host ports docker publishes below). Co-locating api on this
#     same DGX + compose file remains a working assumption (ADR-046 decision
#     5, PRD §9 decision #6 default: co-locate with DB + ai-server, no
#     separate-host instruction received). If the operator assigns a
#     different port or a separate host, only this file's `ports:`/service
#     block needs to change — no code change required.
#   - All secrets come from each service's own .env via env_file at RUN time;
#     the images never contain .env (root .dockerignore excludes it). The
#     operator places apps/ai-server/.env, apps/api/.env, AND apps/web/.env
#     (see apps/web/.env.example) on the DGX before `up`. ENCRYPTION_KEY MUST
#     be byte-identical across the ai-server/api .env files — see
#     docs/ai/deployment_integration_plan.md §6b (ENCRYPTION_KEY SOP) before
#     first boot.
#
# Run from repo root on the DGX:
#   docker compose -f infra/deploy/docker-compose.dgx.yml up -d --build
#   curl -s localhost:24855/health   # ai-server
#   curl -s localhost:24857/health   # api
#   curl -s -I localhost:24858/login # web (placeholder port, no /health route)
#
# DB reachability: DATABASE_URL in each .env points at 223.194.33.26:28881. If
# a container cannot hairpin through the host's external IP, change only the
# DSN host to host.docker.internal:28881 (mapped via extra_hosts below) — an
# .env edit, no code change.
#
# api-server startup order (manual, not compose-orchestrated — see runbook
# docs/ai/deployment_integration_plan.md §6a): apps/api requires
# `alembic upgrade head` to be run manually once against the target DB before
# (or on) first boot of the api container. This file does NOT run migrations
# automatically (no init container / entrypoint hook) — see runbook for why.

name: neuro-sync-ai-dgx

services:
  ai-server:
    build:
      context: ../..
      dockerfile: apps/ai-server/Dockerfile
    container_name: ns-ai-server-dgx
    # No `command:` override and no src/tests volume mounts — the baked image
    # is the deployment artifact; the Dockerfile's production CMD runs
    # (no --reload).
    env_file:
      - ../../apps/ai-server/.env
    environment:
      LOG_LEVEL: info
      # `environment:` outranks env_file in compose precedence. The dev .env
      # carries the workstation-relative PROMPTS_BASE_DIR=docs/ai/prompts,
      # which does not exist inside the container — pin the baked-in copy
      # (Dockerfile: COPY docs/ai/prompts /app/prompts) so env_file injection
      # can never break prompt loading.
      PROMPTS_BASE_DIR: /app/prompts
    ports:
      - "24855:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:
    # ADR-046 decision 5 (2026-07-22): apps/api DGX compose service = working
    # assumption (co-locate with the standing DB + ai-server on this DGX, no
    # separate-host instruction received). Replaceable by the operator without
    # touching apps/api code — swap this block for a remote-host runbook if
    # instructed otherwise.
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: ns-api-dgx
    # No `command:` override — Dockerfile's production CMD runs (no --reload).
    env_file:
      - ../../apps/api/.env
    environment:
      # `environment:` outranks env_file. DATABASE_URL is intentionally NOT
      # overridden here — apps/api/.env (the real operator-managed file, not
      # .env.example) must already carry the production DSN pointed at the
      # same standing external postgres ai-server uses (223.194.33.26:28881,
      # asyncpg driver per apps/api/pyproject.toml). This file defines no
      # postgres service; DATABASE_URL is a reference to that existing
      # container, never a new one. If the shipped .env.example's dev-local
      # value (localhost:5432) leaks into a DGX .env by mistake, the api
      # container fails DB connectivity at boot — visible immediately via the
      # /health check below, not a silent misroute.
      #
      # AI_SERVER_URL is overridden here (same precedence rule) because both
      # services share this compose project's default network — resolving
      # the ai-server service name directly avoids a hairpin round-trip
      # through the external IP:port for same-host, same-project traffic. If
      # api is later moved to a separate host/compose project, change only
      # this one value to http://223.194.33.26:24855 (no code change).
      AI_SERVER_URL: http://ai-server:8001
    ports:
      - "24857:8000"  # external 24856 is SSH NAT — see note at top of file
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai-server
    restart: unless-stopped

  web:
    # Clinician dashboard (apps/web, Next.js standalone). All calls to
    # API_BASE_URL happen server-side only — apps/web/lib/api.ts (the sole
    # caller of API_BASE_URL) is imported only by server components
    # (app/dashboard/page.tsx) and Next.js route handlers
    # (app/api/auth/{login,logout}/route.ts); the two client-side fetch()
    # call sites (components/DashboardHeader.tsx, app/login/LoginForm.tsx)
    # target same-origin `/api/auth/...` paths on this container, never the
    # backend directly. The browser therefore never talks to `api`, so
    # API_BASE_URL is wired to the internal compose network (same-project
    # service-name resolution) instead of the external NAT address —
    # cheaper and avoids a hairpin round-trip, same reasoning as
    # AI_SERVER_URL below the api service above.
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: ns-web-dgx
    env_file:
      - ../../apps/web/.env
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      # Closed-network demo only (apps/web/lib/config.ts::assertProductionTLS,
      # apps/web/lib/auth.ts cookie Secure flag) — this compose file serves
      # both api and web over plain http on an isolated demo network with no
      # TLS termination anywhere in front of them. Never set this for an
      # internet-reachable deployment.
      API_TLS_EXEMPT: "1"
    ports:
      - "${WEB_EXTERNAL_PORT:-24858}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped
